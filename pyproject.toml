[build-system]
requires = ["setuptools>=69", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[project]
name = "eyck"
authors = [
    {name = "Wouter Saelens", email = "wouter.saelens@gmail.com"},
]
description = "Standalone single-cell annotation application"
requires-python = ">=3.11"
keywords = ["bioinformatics", "single-cell", "annotation"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "anndata>=0.10",
    "fastapi>=0.115",
    "filelock>=3.13",
    "numpy>=1.26",
    "pandas>=2.1",
    "polyptich",
    "pyarrow>=15",
    "pydantic>=2.7",
    "scipy>=1.12",
    "uvicorn>=0.30",
]
dynamic = ["version"]
readme = "README.md"
license = "MIT"

[project.urls]
"Homepage" = "https://github.com/instantomics/eyck"
"Bug Tracker" = "https://github.com/instantomics/eyck/issues"

[project.scripts]
eyck = "eyck.cli:main"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "coverage",
    "black",
    "pylint",
    "jupytext",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    "mike",
    "cairosvg",  # for mkdocs social
    "pillow",  # for mkdocs social
    "mkdocs-awesome-pages-plugin",
    "setuptools_scm",
    # "faiss-cpu",
    "Cython",
]
test = [
    "httpx>=0.27",
    "pytest",
    "ruff",
]

[dependency-groups]
dev = ["polyptich"]

[tool.uv.sources]
polyptich = { git = "ssh://git@github.com/instantomics/polyptich.git", group = "dev" }

[tool.setuptools.package-data]
eyck = ["web/assets/*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore",
]

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120
disable = [
    "too-many-arguments",
    "not-callable",
    "redefined-builtin",
    "redefined-outer-name",
]

[tool.jupytext]
formats = "ipynb,py:percent"
